name: Verify source snapshot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify packaged source, app resources and firmware
        run: python tools/verify_snapshot.py
      - name: Test Idea physical touch and shared input adapter
        run: python tests/test_idea_touch.py
      - name: Test radar sweep pixels and damage bounds
        run: |
          cc -O2 -Ifirmware/mosaico-core/components/unveil_native/lvgl tests/radar_sweep.c -lm -o /tmp/unveil-radar-test
          /tmp/unveil-radar-test
      - name: Check Python utilities
        run: python -m py_compile tools/verify_snapshot.py tools/build_mosaico.py tools/package_mosaico.py tools/compact_wifi_font.py tests/run_lua32_protocol.py tests/test_idea_preferences.py tests/test_idea_touch.py
